services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traceguard
      POSTGRES_USER: traceguard
      POSTGRES_PASSWORD: traceguard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - traceguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceguard -d traceguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  traceguard:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://traceguard:traceguard_dev_password@postgres:5432/traceguard
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  traceguard_postgres_data: